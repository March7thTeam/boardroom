name: CI

on:
  push:
    branches: [main, dev]
  # Stacked PRs also need automatic checks before they target main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build:web

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/wrangler-build"

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail

          cp .dev.vars.example .dev.vars
          npm run db:migrate

          npm run dev:api > wrangler.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/v1/setup/status >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "::group::wrangler.log"
            tail -n 200 wrangler.log || true
            echo "::endgroup::"
            echo "wrangler dev did not become ready in time" >&2
            exit 1
          fi

          if ! npm run smoke; then
            echo "::group::wrangler.log"
            tail -n 200 wrangler.log || true
            echo "::endgroup::"
            exit 1
          fi

          if ! node scripts/smoke-solo-self-deal.mjs; then
            echo "::group::wrangler.log"
            tail -n 200 wrangler.log || true
            echo "::endgroup::"
            exit 1
          fi
